[package]
name = "cli-bot"
version = "0.1.2"
edition = "2024"
description = "Translate natural-language requests into shell commands with Ollama"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/joelee/cli-bot"
homepage = "https://github.com/joelee/cli-bot"
keywords = ["cli", "shell", "ollama", "llm"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
owo-colors = "4.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
