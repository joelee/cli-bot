name: Release

# Runs on every push to main, and releases on almost none of them:
# scripts/release-gate.sh releases only when the crate version has no tag
# yet and its records are final, so an ordinary merge does nothing and says
# so. When it does release, this workflow creates the tag itself, builds the
# binaries, and then waits: the `release` environment holds the crates.io
# token and a required reviewer, so nothing is published until a maintainer
# approves. Publishing cannot be undone, only yanked. The GitHub release is
# created from docs/release/<tag>.md, with its binaries attached in the same
# call, because a release is immutable once it exists.
#
# A tag pushed with GITHUB_TOKEN does not start another workflow run, which
# is why the tag is created here rather than by a separate job that would
# then trigger nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.gate.outputs.release }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: gate
        run: scripts/release-gate.sh
      - name: Create the tag
        if: steps.gate.outputs.release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  verify:
    name: Check the tag and the package
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check-release-tag.sh "$TAG"
        env:
          TAG: ${{ needs.gate.outputs.tag }}
      # Keep the version in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A restored cache may hold a same-version build of the crate, which
      # cargo would reuse when verifying the package.
      - run: cargo clean -p cli-bot
      - run: cargo publish --dry-run --locked
      # Swatinem/rust-cache's post step fails with ENOENT on the tests/
      # folder of the crate cargo unpacks into target/package, which is not
      # worth caching anyway, so remove it first, even after a failure.
      - if: always()
        run: rm -rf target/package

  binaries:
    name: Build ${{ matrix.target }}
    needs: [gate, verify]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows is not built for release yet: the binary cannot start,
          # because config resolution needs HOME, the session store needs
          # HOME or XDG_STATE_HOME, and the shell is /bin/sh. Restore this
          # entry with REV-00001-MED-08; the packaging step below is kept
          # ready for it.
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep the version in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # bash on every runner: PowerShell, the default shell on Windows,
      # does not expand `$TARGET`, and cargo then gets an empty target.
      - run: cargo build --release --locked --target "$TARGET"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="cli-bot-${TAG#v}-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/cli-bot" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      # A zip for Windows, with its checksum in shasum's `<hash>  <name>`
      # format so one command checks every download.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $name = "cli-bot-$($env:TAG.TrimStart('v'))-$env:TARGET"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/$env:TARGET/release/cli-bot.exe", LICENSE, README.md -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: |
            cli-bot-*.tar.gz*
            cli-bot-*.zip*

  crates:
    name: Publish to crates.io
    needs: [gate, binaries]
    runs-on: ubuntu-latest
    # The `release` environment holds the crates.io token and a required
    # reviewer, who must approve before anything is published. It has no
    # deployment branch policy: the gate job, not the environment, is what
    # decides that this commit should be released.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep the version in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      # Deliberately no build cache: this job holds the crates.io token, so
      # it restores nothing it did not build itself.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create the GitHub release and attach binaries
    needs: [gate, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      # A release is immutable once created, so its assets have to be part
      # of the call that creates it: a later `gh release upload` is refused
      # with "HTTP 422: Cannot upload assets to an immutable release", which
      # is how v0.4.0 ended up with notes and no binaries. For the same
      # reason a partly created release cannot be repaired by re-running, so
      # this fails loudly when the release already exists.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "error: release $TAG already exists; it cannot be" >&2
            echo "amended, so delete it before re-running this job." >&2
            exit 1
          fi
          notes="docs/release/$TAG.md"
          args=(--verify-tag --title "cli-bot $TAG")
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "${args[@]}" dist/*
