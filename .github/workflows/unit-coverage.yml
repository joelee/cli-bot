name: Unit Coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Keep the version in step with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install just and cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov,cargo-nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Write LCOV coverage report
        run: just coverage-lcov

      - name: Write HTML coverage report
        run: just coverage-html

      - name: Run tests with JUnit output
        if: always()
        run: just test-junit

      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-bot-unit-coverage-html
          path: |
            target/llvm-cov/html/**
            target/coverage/lcov.info
            target/test-results/unit-tests.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/lcov.info
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@v1
        with:
          files: target/test-results/unit-tests.xml
          fail_ci_if_error: false
