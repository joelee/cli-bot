name: Unit Coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit coverage
        run: bash ./scripts/coverage-unit.sh

      - name: Run unit tests with JUnit output
        if: always()
        run: |
          mkdir -p target/test-results
          cargo nextest run --lib --junit-report target/test-results/unit-tests.xml

      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-bot-unit-coverage-html
          path: |
            target/coverage/html/**
            target/coverage/unit-report.txt
            target/coverage/unit-tests.profdata
            target/coverage/lcov.info
            target/test-results/unit-tests.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/lcov.info
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@v1
        with:
          files: target/test-results/unit-tests.xml
          fail_ci_if_error: false
