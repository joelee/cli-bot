name: Release Checks

on:
  pull_request:
  # Feature branches run the checks on every push, before a pull request exists.
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Rust Project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Keep the version in step with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install just and cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov,cargo-deny

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Format, lint, scripts, links, tests, coverage gate, build, the
      # supply-chain audit, the publish dry run, and the workflow lint.
      - name: Run all checks (just ci)
        run: just ci
