name: Release Checks

on:
  pull_request:
  # Feature branches run the checks on every push, before a pull request exists.
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Rust Project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Keep the version in step with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install just and cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run all checks (format, lint, scripts, tests, coverage gate, build, package)
        run: just check

      - name: List packaged crate contents
        run: just package-list

  publish-prep:
    name: Prepare Publish Artifact
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Keep the version in step with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Install just and cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build crate archive
        run: just package

      - name: Upload crate package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-bot-crate
          path: target/package/*.crate
          if-no-files-found: error
