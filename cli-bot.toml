[ollama]
base_url = "http://127.0.0.1:11434"
model = "ornith-1.5:9b"
temperature = 0.0
use_chat_api = true

# How long one planner call may take, in seconds; 0 removes the limit.
# Loading a large model for the first time can take minutes.
request_timeout_seconds = 300
# How long opening the connection may take, in seconds; 0 removes the limit.
# Kept short, so an Ollama that is not running fails at once.
connect_timeout_seconds = 10
system_prompt = """
You translate natural-language requests into safe shell commands.
Return valid JSON only.
Do not wrap the JSON in Markdown fences.
Prefer concise, POSIX-friendly shell commands.
"""

[environment]
os = "auto"
distro = "auto"
preferred_package_manager = "auto"

[safety]
# The master switch. Setting this to false runs every command without
# asking, including destructive ones.
require_confirmation = true

# Pre-approves the state-changing tier, as `--yes` does. The destructive
# tier is never pre-approved from configuration; that needs
# `--i-approve-destructive-commands` on the command line.
assume_yes = false

# Commands that run without asking. Each entry matches whole leading words,
# so "git log" covers "git log --oneline" but not "git logs". Everything not
# listed here is confirmed first. See docs/configuration.md.
read_only_commands = [
  "ls", "dir", "vdir", "cat", "bat", "head", "tail", "less", "more",
  "wc", "stat", "file", "du", "df", "tree", "find", "fd", "grep", "rg",
  "pwd", "whoami", "id", "groups", "hostname", "uname", "uptime", "date",
  "cal", "printenv", "which", "type", "man", "tldr", "ps", "free",
  "lscpu", "lsblk", "lsusb", "lspci", "ping", "dig", "host", "nslookup",
  "traceroute", "echo", "printf", "basename", "dirname", "realpath",
  "readlink", "sort", "uniq", "cut", "nl", "diff", "cmp", "md5sum",
  "sha256sum",
  "git status", "git log", "git diff", "git show", "git branch",
  "git remote", "git blame", "git describe",
  "docker ps", "docker images", "systemctl status", "cargo tree",
  "npm list"
]

# Extra commands for the destructive tier, matched the same way. The
# built-in rules already cover rm, find, chmod, chown, git, docker,
# systemctl, shred, dd, mkfs, kill, and shutdown; add your own here.
destructive_commands = []

# Text that forces the destructive tier wherever it appears in a command.
# Matched case-insensitively, anywhere in the text, so it can fire on a
# quoted argument too.
destructive_substrings = [
  "rm -rf",
  "mkfs",
  "dd if=",
  "fdisk",
  "parted",
  "shutdown",
  "reboot",
  "poweroff",
  "kill -9",
  "killall",
  "pkill",
  "chmod -r",
  "chmod -R",
  "chown -R",
  "truncate",
  "docker system prune",
  "git reset --hard",
  "> /",
  ">> /"
]

[ui]
selection_prompt = "Multiple commands match your request. Select one to execute"
approval_prompt = "This command may be destructive. Approve execution?"
confirmation_prompt = "Run this command?"
show_command_before_execution = true
auto_select_recommended = false

[execution]
shell = "/bin/sh"
shell_arg = "-c"
preferred_editor = "nvim"

[session_memory]
enabled = true
default_name = "default"
scope = "working_directory"
storage_dir = "auto"
max_turns = 6
include_working_directory = true
save_text_responses = true
save_selected_commands = true
capture_command_output = false
include_command_output_in_prompt = false
max_output_bytes = 8192
retention_days = 14

[models_benchmark]
models = [
  "ornith-1.5:9b",
  "phi4-mini:latest",
  "lfm2.5:8b",
  "gemma4:latest",
  "qwen3.8:27b",
  "muse-glimmer:latest",
  "nemotron-3.5-lightning:30b",
  "nemotron-3-super:120b"
]
queries = [
  "Ping google five times",
  "Print the last git log message",
  "What is my external IP address?",
  "Is neovim installed?",
  "230*(123-22)",
  "List all markdown files recursively in my home directory",
  "What is the purpose of life?"
]
